<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Drum Kit</h1>
    </header>
    <main>
        <div class="instructions">
            <p>Pressione as teclas <strong>Q, W, E, A, S, D, Z, X, C</strong> ou clique nos pads para tocar</p>
        </div>
        <div class="keys">
            <div data-key="keyq" class="key" aria-label="Tecla Q - Som de bateria">Q</div>
            <div data-key="keyw" class="key" aria-label="Tecla W - Som de bateria">W</div>
            <div data-key="keye" class="key" aria-label="Tecla E - Som de bateria">E</div>

            <div data-key="keya" class="key" aria-label="Tecla A - Som de bateria">A</div>
            <div data-key="keys" class="key" aria-label="Tecla S - Som de bateria">S</div>
            <div data-key="keyd" class="key" aria-label="Tecla D - Som de bateria">D</div>

            <div data-key="keyz" class="key" aria-label="Tecla Z - Som de bateria">Z</div>
            <div data-key="keyx" class="key" aria-label="Tecla X - Som de bateria">X</div>
            <div data-key="keyc" class="key" aria-label="Tecla C - Som de bateria">C</div>
        </div>
        <div class="volume-control">
            <span class="volume-label">VOL</span>
            <div class="volume-slider-wrapper">
                <input type="range" id="volume" min="0" max="100" step="1" value="100" aria-label="Controle de volume">
            </div>
            <span class="volume-value" id="volumeValue">100</span>
        </div>
        <div class="bpm-control">
            <span class="bpm-label">BPM</span>
            <div class="bpm-slider-wrapper">
                <input type="range" id="bpm" min="60" max="400" step="5" value="240" aria-label="Controle de BPM">
            </div>
            <span class="bpm-value clickable" id="bpmValue" role="button" tabindex="0" aria-label="Abrir presets de BPM">240</span>
            <div class="bpm-dropdown" id="bpmDropdown">
                <button class="bpm-preset" data-bpm="60" type="button">60</button>
                <button class="bpm-preset" data-bpm="90" type="button">90</button>
                <button class="bpm-preset" data-bpm="120" type="button">120</button>
                <button class="bpm-preset" data-bpm="140" type="button">140</button>
                <button class="bpm-preset" data-bpm="160" type="button">160</button>
                <button class="bpm-preset" data-bpm="180" type="button">180</button>
                <button class="bpm-preset" data-bpm="200" type="button">200</button>
                <button class="bpm-preset" data-bpm="240" type="button">240</button>
            </div>
        </div>
        <button class="metronome-toggle" id="metronomeToggle" type="button" aria-label="Ativar metrônomo">Metr</button>
        <form class="composer" aria-label="Compositor de batidas">
            <div class="composer-timeline">
                <div class="timeline-track">
                    <div class="timeline-empty">
                        <span class="timeline-empty-text">—</span>
                    </div>
                    <div class="timeline-notes"></div>
                </div>
            </div>
            <input type="text" id="input" placeholder="Faça uma composição..." required />
            <button id="playBtn" type="submit" aria-label="Tocar composição">Tocar</button>
            <button id="stopBtn" type="button" aria-label="Parar composição" disabled>Parar</button>
        </form>
        <button class="loop-toggle" id="loopToggle" type="button" aria-label="Ativar loop">Loop</button>
    </main>
    <footer>
        <span>Criado por</span>
        <a href="https://github.com/kevinluann" target="_blank">Kevin Luan</a>
    </footer>
    <div class="audio-container">
        <audio id="s_keyq" src="sounds/keyq.wav" preload="auto"></audio>
        <audio id="s_keyw" src="sounds/keyw.wav" preload="auto"></audio>
        <audio id="s_keye" src="sounds/keye.wav" preload="auto"></audio>
        <audio id="s_keya" src="sounds/keya.wav" preload="auto"></audio>
        <audio id="s_keys" src="sounds/keys.wav" preload="auto"></audio>
        <audio id="s_keyd" src="sounds/keyd.wav" preload="auto"></audio>
        <audio id="s_keyz" src="sounds/keyz.wav" preload="auto"></audio>
        <audio id="s_keyx" src="sounds/keyx.wav" preload="auto"></audio>
        <audio id="s_keyc" src="sounds/keyc.wav" preload="auto"></audio>
        <audio id="s_metronome" src="sounds/metronome.wav" preload="auto"></audio>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
