<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <header>
        <h1>Drum Kit</h1>
    </header>
    <main>
        <div class="instructions">
            <p>Pressione as teclas <strong>Q, W, E, A, S, D, Z, X, C</strong> ou clique nos pads para tocar</p>
        </div>
        <div class="workspace">
            <aside class="side-controls side-controls--left" aria-label="Controles de BPM e metrônomo">
                <div class="bpm-control">
                    <span class="bpm-label">BPM</span>
                    <div class="bpm-slider-wrapper">
                        <input type="range" id="bpm" min="60" max="400" step="5" value="240" aria-label="Controle de BPM">
                    </div>
                    <span class="bpm-value clickable" id="bpmValue" role="button" tabindex="0" aria-label="Abrir presets de BPM">240</span>
                    <div class="bpm-dropdown" id="bpmDropdown">
                        <button class="bpm-preset" data-bpm="60" type="button">60</button>
                        <button class="bpm-preset" data-bpm="90" type="button">90</button>
                        <button class="bpm-preset" data-bpm="120" type="button">120</button>
                        <button class="bpm-preset" data-bpm="140" type="button">140</button>
                        <button class="bpm-preset" data-bpm="160" type="button">160</button>
                        <button class="bpm-preset" data-bpm="180" type="button">180</button>
                        <button class="bpm-preset" data-bpm="200" type="button">200</button>
                        <button class="bpm-preset" data-bpm="240" type="button">240</button>
                    </div>
                </div>
                <button class="metronome-toggle" id="metronomeToggle" type="button" aria-label="Ativar metrônomo">Metr</button>
                <div class="metronome-bpm-inline" id="metronomeBpmInline">
                    <input type="number" id="metronomeBpmInput" min="30" max="400" value="120" class="metronome-bpm-inline-input" aria-label="BPM do metrônomo">
                </div>
            </aside>
            <div class="keys">
                <div data-key="keyq" class="key" aria-label="Tecla Q - Som de bateria">Q</div>
                <div data-key="keyw" class="key" aria-label="Tecla W - Som de bateria">W</div>
                <div data-key="keye" class="key" aria-label="Tecla E - Som de bateria">E</div>

                <div data-key="keya" class="key" aria-label="Tecla A - Som de bateria">A</div>
                <div data-key="keys" class="key" aria-label="Tecla S - Som de bateria">S</div>
                <div data-key="keyd" class="key" aria-label="Tecla D - Som de bateria">D</div>

                <div data-key="keyz" class="key" aria-label="Tecla Z - Som de bateria">Z</div>
                <div data-key="keyx" class="key" aria-label="Tecla X - Som de bateria">X</div>
                <div data-key="keyc" class="key" aria-label="Tecla C - Som de bateria">C</div>
            </div>
            <aside class="side-controls side-controls--right" aria-label="Controles de volume e loop">
                <div class="volume-control">
                    <span class="volume-label">VOL</span>
                    <div class="volume-slider-wrapper">
                        <input type="range" id="volume" min="0" max="100" step="1" value="100" aria-label="Controle de volume">
                    </div>
                    <span class="volume-value" id="volumeValue">100</span>
                </div>
                <button class="loop-toggle" id="loopToggle" type="button" aria-label="Ativar loop">Loop</button>
            </aside>
        </div>
        <form class="composer" aria-label="Compositor de batidas">
            <div class="composer-timeline">
                <div class="note-info">
                    <button type="button" id="zoomOut" class="zoom-btn" aria-label="Diminuir zoom">−</button>
                    <div class="note-info-center">
                        <span class="note-count" id="noteCount">0 notas</span>
                        <span class="note-separator">•</span>
                        <span class="duration-display" id="durationDisplay">0.0s</span>
                    </div>
                    <button type="button" id="zoomIn" class="zoom-btn" aria-label="Aumentar zoom">+</button>
                </div>
                <div class="timeline-track">
                    <div class="timeline-empty">
                        <span class="timeline-empty-text">—</span>
                    </div>
                    <div class="timeline-notes"></div>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="input" placeholder="Faça uma composição..." required />
                <button id="randomBtn" type="button" aria-label="Gerar composição aleatória">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button id="reverseBtn" type="button" aria-label="Inverter composição" class="disabled">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <polyline points="23 20 23 14 17 14"></polyline>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                    </svg>
                </button>
            </div>
            <button id="playBtn" type="submit" aria-label="Tocar composição">Tocar</button>
            <button id="stopBtn" type="button" aria-label="Parar composição" disabled>Parar</button>
        </form>
    </main>
    <button class="record-toggle" id="recordToggle" type="button" aria-label="Gravar composição">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="7"></circle>
            <circle cx="8" cy="8" r="2"></circle>
        </svg>
    </button>
    <button class="stats-toggle" id="statsToggle" type="button" aria-label="Abrir/fechar estatísticas">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
    </button>
    <div class="stats-panel" id="statsPanel">
        <div class="stats-header">
            <h3>Estatísticas</h3>
        </div>
        <div class="stats-content">
            <div class="stats-item">
                <span class="stats-label">Total de notas:</span>
                <span class="stats-value" id="totalNotes">0</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Tempo de reprodução:</span>
                <span class="stats-value" id="totalTime">0s</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Composições tocadas:</span>
                <span class="stats-value" id="totalCompositions">0</span>
            </div>
            <button id="resetStats" type="button" class="reset-stats-btn">Resetar</button>
        </div>
    </div>
    <footer>
        <span>Criado por</span>
        <a href="https://github.com/kevinluann" target="_blank">Kevin Luan</a>
    </footer>
    <div class="audio-container">
        <audio id="s_keyq" src="sounds/keyq.wav" preload="auto"></audio>
        <audio id="s_keyw" src="sounds/keyw.wav" preload="auto"></audio>
        <audio id="s_keye" src="sounds/keye.wav" preload="auto"></audio>
        <audio id="s_keya" src="sounds/keya.wav" preload="auto"></audio>
        <audio id="s_keys" src="sounds/keys.wav" preload="auto"></audio>
        <audio id="s_keyd" src="sounds/keyd.wav" preload="auto"></audio>
        <audio id="s_keyz" src="sounds/keyz.wav" preload="auto"></audio>
        <audio id="s_keyx" src="sounds/keyx.wav" preload="auto"></audio>
        <audio id="s_keyc" src="sounds/keyc.wav" preload="auto"></audio>
        <audio id="s_metronome" src="sounds/metronome.wav" preload="auto"></audio>
    </div>
    <div id="noteBpmOverlay" class="note-bpm-overlay"></div>
    <div id="noteBpmEditor" class="note-bpm-editor">
        <h3 class="note-bpm-title">Configurar Nota</h3>
        <div class="note-bpm-field">
            <label class="note-bpm-label">BPM</label>
            <input type="number" id="noteBpmInput" min="60" max="400" value="240" class="note-bpm-input" aria-label="BPM da nota">
        </div>
        <div class="note-bpm-field">
            <label class="note-bpm-label">Repetir</label>
            <div class="note-bpm-repeat">
                <button type="button" class="repeat-btn active" data-repeat="1">1x</button>
                <button type="button" class="repeat-btn" data-repeat="2">2x</button>
                <button type="button" class="repeat-btn" data-repeat="3">3x</button>
                <button type="button" class="repeat-btn" data-repeat="4">4x</button>
            </div>
        </div>
        <div class="note-bpm-field">
            <label class="note-bpm-label">Som</label>
            <button type="button" id="muteNoteBtn" class="mute-btn">Silenciar</button>
        </div>
        <div class="note-bpm-field">
            <label class="note-bpm-label">Volume</label>
            <div class="note-volume-wrapper">
                <input type="range" id="noteVolumeInput" min="0" max="100" value="100" class="note-volume-input">
                <span class="note-volume-value" id="noteVolumeValue">100</span>
            </div>
        </div>
        <div class="note-bpm-buttons">
            <button id="saveNoteBpm" type="button" class="note-bpm-btn note-bpm-btn--save">Salvar</button>
            <button id="removeNoteBpm" type="button" class="note-bpm-btn note-bpm-btn--remove">Remover</button>
            <button id="cancelNoteBpm" type="button" class="note-bpm-btn note-bpm-btn--cancel">Cancelar</button>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
